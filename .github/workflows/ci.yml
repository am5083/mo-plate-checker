name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Elm tools
        run: npm install --global elm@0.19.1-6 elm-test@0.19.1-revision17

      - name: Build
        run: elm make src/Main.elm --output=/dev/null

      - name: Test
        run: elm-test
